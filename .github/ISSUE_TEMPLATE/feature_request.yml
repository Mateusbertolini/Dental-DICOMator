name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes: {label: Dental education or research need}
    validations: {required: true}
  - type: textarea
    id: behavior
    attributes: {label: Proposed behavior and expected DICOM result}
    validations: {required: true}
  - type: textarea
    id: validation
    attributes: {label: Suggested validation}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I will use only synthetic or fully de-identified examples.
          required: true

