name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Use only synthetic or fully de-identified examples. Never upload PHI."
  - type: input
    id: addon
    attributes: {label: Dental DICOMator version, placeholder: "1.0.7"}
    validations: {required: true}
  - type: input
    id: blender
    attributes: {label: Blender version}
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: Operating system}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, description: "Include dimensions, materials, painted layers, depths, and settings."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected result}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual result and error text}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I confirm that this report contains no PHI or patient identifiers.
          required: true

